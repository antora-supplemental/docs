name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [docs-source-updated, extension-updated, link-cache-invalidate]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve dispatch checkout ref
        if: github.event_name == 'repository_dispatch'
        id: dispatch_ref
        run: |
          ref="${{ github.event.client_payload.ref }}"
          if [ -z "$ref" ]; then
            ref="main"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Resolve link-cache-invalidate env
        if: github.event_name == 'repository_dispatch' && github.event.action == 'link-cache-invalidate'
        id: link_invalidate
        env:
          RAW_SOURCES: ${{ toJSON(github.event.client_payload.sources) }}
          RAW_URLS: ${{ toJSON(github.event.client_payload.urls) }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const out = process.env.GITHUB_OUTPUT;
          function csv(raw) {
            if (raw === undefined || raw === null || raw === '' || raw === 'null') return '';
            let v;
            try {
              v = JSON.parse(raw);
            } catch {
              v = raw;
            }
            if (Array.isArray(v)) return v.map(String).filter(Boolean).join(',');
            return String(v);
          }
          const sources = csv(process.env.RAW_SOURCES);
          const urls = csv(process.env.RAW_URLS);
          fs.appendFileSync(out, `sources=${sources}\n`);
          fs.appendFileSync(out, `urls=${urls}\n`);
          NODE

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'repository_dispatch' && steps.dispatch_ref.outputs.ref || github.ref }}

      - name: Clone asciidoc-interactive (pnpm file:../asciidoc-interactive)
        run: git clone --depth 1 https://github.com/antora-supplemental/asciidoc-interactive.git "${GITHUB_WORKSPACE}/../asciidoc-interactive"

      - name: Clone antora-serve (pnpm file:../antora-serve)
        run: git clone --depth 1 https://github.com/antora-supplemental/antora-serve.git "${GITHUB_WORKSPACE}/../antora-serve"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore link check cache
        uses: actions/cache@v4
        with:
          path: .link-check-cache.json
          key: link-check-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.antora-link-suppressions.yml') }}
          restore-keys: |
            link-check-cache-${{ runner.os }}-

      - name: Build Antora site
        id: antora
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINK_VALIDATOR_INVALIDATE_SOURCES: ${{ steps.link_invalidate.outputs.sources }}
          LINK_VALIDATOR_INVALIDATE_URLS: ${{ steps.link_invalidate.outputs.urls }}
        uses: antora-supplemental/antora-build-action@v3
        with:
          playbook: antora-playbook.yml
          output_dir: build/site
          install_dependencies: false
          setup_pnpm: false
          setup_node: false
          fetch: true

      - name: Add custom domain CNAME
        run: echo 'docs.antora-supplemental.org' > "${{ steps.antora.outputs.site-path }}/CNAME"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.antora.outputs.site-path }}

  deploy:
    if: >
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
