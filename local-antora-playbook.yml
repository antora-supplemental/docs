# Local development playbook (sibling repos)
# Full playbook — Antora does not support YAML `extends`.

site:
  title: Antora Supplemental
  start_page: docs:ROOT:index.adoc
  keys:
    header_logo: logo.svg
    dark_mode_navbar: light
    site_home_url: https://antora-supplemental.org/
    site_home_label: antora-supplemental home
    header_doc_title: Docs
    github_profile_url: https://github.com/antora-supplemental
  url: https://docs.antora-supplemental.org

content:
  sources:
    - url: ../antora-demo-template
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../antora-extensions-registry
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../dprint-plugin-asciidoc
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../asciidoc-interactive
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../antora-live
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: .
      branches: HEAD
      start_path: docs
      worktrees: true

ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: ./build/site

urls:
  html_extension_style: indexify

antora:
  extensions:
    - require: "@antora/lunr-extension"
      index_latest_only: true
      index_by_heading: true
      snippet_length: 200
    - require: "@antora-supplemental/antora-search-chat"
    - require: "@antora-supplemental/incremental"
    - require: "@antora-supplemental/unversioned-component-urls"
    - require: "@antora-supplemental/site-nav-tree"
      include: [docs, antora-live, instruction-flow, registry, dprint-asciidoc]
      order: [docs, antora-live, instruction-flow, registry, dprint-asciidoc]
    - require: "@antora-supplemental/nav-typology"
    - require: "@antora-supplemental/nav-typology-diataxis"
    - "@antora-supplemental/build-stack"
    - "@antora-supplemental/page-edit"
    - require: "@antora-supplemental/page-context/antora"
      component: docs
      path: keywords

asciidoc:
  attributes:
    stem: latexmath
    kroki-server-url: https://kroki.io
    kroki-fetch-diagram: true
    page-context-active: ""
    page-context-keyword-base: "/docs/keywords"
    source-highlighter: highlight.js
    icons: font
  extensions:
    - asciidoctor-kroki
    - "@antora-supplemental/page-context"
    - ./node_modules/@antora-supplemental/instruction-flow/lib/instruction-flow-extension.js
