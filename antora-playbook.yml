# Antora Supplemental documentation site
# Aggregates antora-supplemental org repos (Root Strategy)
# Local clones: same playbook; @antora-supplemental/facto-stack registers antora-local-content-sources (auto off in CI).
# Snapshot: build/.antora/antora-playbook-local.generated.yml (gitignored).

site:
  title: Antora Supplemental
  start_page: docs:ROOT:index.adoc
  keys:
    header_logo: logo.svg
    dark_mode_navbar: light
    site_home_url: https://antora-supplemental.org/
    site_home_label: antora-supplemental home
    header_doc_title: Docs
    github_profile_url: https://github.com/antora-supplemental
  url: https://docs.antora-supplemental.org
  robots: |
    User-agent: *
    Allow: /
    Sitemap: https://docs.antora-supplemental.org/sitemap.xml

content:
  sources:
    - url: https://github.com/antora-supplemental/antora-demo-template.git
      branches: [main, master]
      start_path: docs
    - url: https://github.com/antora-supplemental/antora-extensions-registry.git
      branches: [main, master]
      start_path: docs
    - url: https://github.com/antora-supplemental/dprint-plugin-asciidoc.git
      branches: [main, master]
      start_path: docs
    - url: https://github.com/antora-supplemental/asciidoc-interactive.git
      branches: [main, master]
      start_path: docs
    - url: https://github.com/antora-supplemental/antora-live.git
      branches: [main, master]
      start_path: docs
    - url: .
      branches: HEAD
      start_path: docs
      worktrees: true

ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v3/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: ./build/site

urls:
  html_extension_style: indexify

antora:
  extensions:
    # Incremental builds are not part of the compose pack; keep before it.
    - require: "@antora-supplemental/incremental"
    # Compose pack (hub profile): lunr, search-chat, unversioned URLs, site-nav-tree,
    # nav-typology(+diataxis), build-stack, page-edit, link-validator, linkinator,
    # soft-nav-page-toc, extension-lister, orphan-finder, page-context keyword pages.
    - require: "@antora-supplemental/facto-stack"
      profile: hub
      lunr:
        index_latest_only: true
        index_by_heading: true
        snippet_length: 200
      siteNavTree:
        enabled: true
        filter: false
        # Forest allowlist - samples stay published but are not a sidebar root.
        include: [docs, antora-live, instruction-flow, registry, dprint-asciidoc]
        order: [docs, antora-live, instruction-flow, registry, dprint-asciidoc]
      softNavPageToc:
        injectScript: false
      pageContextAntora:
        component: docs
        path: keywords

asciidoc:
  attributes:
    stem: latexmath
    kroki-server-url: https://kroki.io
    kroki-fetch-diagram: true
    page-context-active: ""
    page-context-keyword-base: "/docs/keywords"
    source-highlighter: highlight.js
    icons: font
  extensions:
    - ./node_modules/@antora-supplemental/instruction-flow/lib/instruction-flow-extension.js
